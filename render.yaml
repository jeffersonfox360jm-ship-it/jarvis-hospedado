services:
  - type: web
    name: jarvis
    runtime: node
    plan: free
    buildCommand: echo "sem dependências"
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: APP_PIN
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: YOUTUBE_API_KEY
        sync: false
      - key: YOUTUBE_REGION
        value: BR
      - key: GROQ_API_KEY
        sync: false
      - key: MODEL_GROQ
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: MODEL_OPENAI
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: MODEL_GEMINI
        sync: false
